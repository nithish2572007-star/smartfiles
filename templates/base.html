<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFiles - Intelligent Personal File Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                    </svg>
                </div>
                <h1>SmartFiles</h1>
                <span class="version-pill">v0.1 Managed</span>
            </a>
            <nav>
                <ul>
                    <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        Dashboard
                    </a></li>
                    <li><a href="/search" class="{% if request.path == '/search' %}active{% endif %}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        Search
                    </a></li>
                    <li><a href="/duplicates" class="{% if request.path == '/duplicates' %}active{% endif %}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Duplicates
                    </a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Global Accessible Modal Dialog -->
    <dialog id="app-modal" class="custom-modal">
        <div class="modal-header">
            <h3 id="modal-title">Action Confirmation</h3>
            <button type="button" class="btn btn-secondary btn-sm" id="modal-close-x" style="padding: 2px 8px; font-size: 1.1rem; border: none; background: transparent;">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">
            <!-- Modal dynamic content -->
        </div>
        <div class="modal-footer" id="modal-footer">
            <button type="button" class="btn btn-secondary" id="modal-btn-cancel">Cancel</button>
            <button type="button" class="btn btn-primary" id="modal-btn-confirm">Confirm</button>
        </div>
    </dialog>

    <!-- Toast Notifications Container -->
    <div id="toast-container" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
