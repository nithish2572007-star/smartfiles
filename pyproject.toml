[project]
name = "smartfiles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nithish2572007-star", email = "nithish25.7.2007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "send2trash>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
